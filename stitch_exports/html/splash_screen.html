        @keyframes scanline {
            0% { transform: translateY(-100%); }

            50% { opacity: 0; }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.9; }
            15% { opacity: 0.93; }
            20% { opacity: 0.98; }
            100% { opacity: 1; }

        @keyframes logo-float {

            50% { transform: translateY(-10px) scale(1.02); }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%

                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 101;
            background: linear-gradient(0deg, rgba(0, 230, 57, 0) 0%, rgba(0, 230, 57, 0.05) 50%, rgba(0, 230, 57, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }
        .blink { animation: blink 1s step-end infinite; }
        .flicker { animation: flicker 0.15s infinite; }
        .logo-anim { animation: logo-float 4s ease-in-out infinite; }
        
        .pixel-border {
            box-shadow: 
                0 -4px 0 0 #131313,
                0 4px 0 0 #131313,
                -4px 0 0 0 #131313,
                4px 0 0 0 #131313,
                0 -8px 0 0 #00e639,
                0 8px 0 0 #00e639,
                -8px 0 0 0 #00e639,
                4px 0 0 0 #00e639; /* Simplified pixel effect */
        }
        
        body {

        }

        .terminal-block {

            width: 12px;
            height: 24px;

<script>
        // Simulation of loading process
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const statusText = document.getElementById('status-text');
        
        let progress = 0;
        const statusMessages = [
            "CONNECTING TO GLOBAL FEED...",
            "SYNCING ENCRYPTION KEYS...",
            "BUFFERING PIXEL ASSETS...",
            "BYPASSING FIREWALLS...",
            "RENDERING NEWS GRID...",
            "OPTIMIZING SCANLINES...",
            "SYSTEM READY."
        ];

        function updateProgress() {
            if (progress < 100) {
                // Random jumps to feel like a real old computer
                const increment = Math.random() * 8;
                progress = Math.min(progress + increment, 100);
                
                progressBar.style.width = `${progress}%`;
                progressPercent.innerText = `${Math.floor(progress)}%`;

                // Update status messages based on thresholds
                if (progress > 15 && progress < 30) updateStatus(0);
                if (progress > 35 && progress < 50) updateStatus(1);
                if (progress > 55 && progress < 70) updateStatus(2);
                if (progress > 75 && progress < 85) updateStatus(3);
                if (progress > 90) updateStatus(4);
                
                const nextStep = Math.random() * 400 + 100;
                setTimeout(updateProgress, nextStep);
            } else {
                updateStatus(6);
                // Simulate "Press Start" or auto-redirect
                progressPercent.innerHTML = "OK";
                progressPercent.classList.add('blink');
            }
        }

        let currentStatusIndex = -1;
        function updateStatus(index) {
            if (index !== currentStatusIndex) {
                currentStatusIndex = index;
                const newSpan = document.createElement('div');
                newSpan.innerHTML = `<span class="text-secondary-fixed-dim">></span> ${statusMessages[index]}`;
                statusText.appendChild(newSpan);
                
                // Keep only last 4 messages
                while (statusText.children.length > 4) {
                    statusText.removeChild(statusText.firstChild);
                }
            }
        }

        // Initialize loading
        setTimeout(updateProgress, 1000);

        // Add random "glitch" effect to logo
        setInterval(() => {
            const logo = document.querySelector('.logo-anim');
            if (Math.random() > 0.95) {
                logo.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
                logo.style.filter = `hue-rotate(${Math.random()*90}deg)`;
                setTimeout(() => {
                    logo.style.transform = '';
                    logo.style.filter = '';
                }, 50);
            }
        }, 100);
    </script>
